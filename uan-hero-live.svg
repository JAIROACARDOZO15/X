<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Campus institucional de la Universidad Autónoma Nacional, ilustración estilizada al atardecer">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#07130f"/>
      <stop offset="55%" stop-color="#0b1c16"/>
      <stop offset="100%" stop-color="#123021"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="72%" r="60%">
      <stop offset="0%" stop-color="#d9a936" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#2e8b57" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#07130f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="bldg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#123021"/>
      <stop offset="100%" stop-color="#07130f"/>
    </linearGradient>
    <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1.1" fill="#54bd68" fill-opacity="0.15"/>
    </pattern>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#dots)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>

  <!-- horizonte con leve resplandor dorado -->
  <rect x="0" y="760" width="1600" height="4" fill="#d9a936" fill-opacity="0.25"/>

  <!-- skyline institucional estilizado -->
  <g fill="url(#bldg)" stroke="#2e8b57" stroke-opacity="0.35" stroke-width="1.5">
    <rect x="90"  y="560" width="150" height="200"/>
    <rect x="260" y="480" width="120" height="280"/>
    <rect x="400" y="600" width="170" height="160"/>

    <!-- edificio central con frontón, tipo biblioteca/aula magna -->
    <g>
      <rect x="620" y="470" width="360" height="290"/>
      <polygon points="620,470 800,370 980,470"/>
      <rect x="700" y="560" width="30" height="200"/>
      <rect x="760" y="560" width="30" height="200"/>
      <rect x="820" y="560" width="30" height="200"/>
      <rect x="880" y="560" width="30" height="200"/>
      <rect x="940" y="560" width="30" height="200"/>
    </g>

    <rect x="1030" y="610" width="150" height="150"/>
    <rect x="1200" y="500" width="130" height="260"/>
    <rect x="1350" y="540" width="110" height="220"/>
    <rect x="1470" y="590" width="120" height="170"/>
  </g>

  <!-- torre / reloj institucional -->
  <g>
    <rect x="775" y="230" width="50" height="150" fill="url(#bldg)" stroke="#2e8b57" stroke-opacity="0.35" stroke-width="1.5"/>
    <polygon points="775,230 800,180 825,230" fill="#123021" stroke="#d9a936" stroke-opacity="0.5" stroke-width="1.5"/>
    <circle cx="800" cy="270" r="14" fill="none" stroke="#d9a936" stroke-opacity="0.6" stroke-width="2"/>
  </g>

  <!-- luces cálidas en ventanas -->
  <g fill="#d9a936" fill-opacity="0.55">
    <rect x="705" y="580" width="16" height="16"/>
    <rect x="765" y="620" width="16" height="16"/>
    <rect x="885" y="600" width="16" height="16"/>
    <rect x="945" y="660" width="16" height="16"/>
    <rect x="270" y="520" width="14" height="14"/>
    <rect x="1220" y="560" width="14" height="14"/>
    <rect x="1370" y="600" width="14" height="14"/>
  </g>

  <!-- textura sutil de líneas técnicas -->
  <g stroke="#54bd68" stroke-opacity="0.08" stroke-width="1">
    <line x1="0" y1="120" x2="1600" y2="120"/>
    <line x1="0" y1="240" x2="1600" y2="240"/>
  </g>
</svg>
