<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#07130f">
<title>Universidad Autónoma Nacional · Plataforma Integra</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=JetBrains+Mono:wght@500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="estilos.css?v=9">
</head>
<body>

<!-- ================= INICIO INSTITUCIONAL ================= -->
<div id="inicio" class="inicio-uan">
  <div class="uan-hero-shell" aria-label="Portal institucional de la Universidad Autónoma Nacional">
    <img class="uan-hero-image" src="uan-hero.png" alt="Campus de la Universidad Autónoma Nacional al atardecer">

    <!-- Hotspots invisibles: la imagen conserva el diseño visual y estas zonas hacen los accesos realmente interactivos. -->
    <button class="role-hotspot hotspot-admin" type="button" aria-label="Ingresar como administrativo" onclick="mostrarLogin('admin')"></button>
    <button class="role-hotspot hotspot-doc" type="button" aria-label="Ingresar como docente" onclick="mostrarLogin('doc')"></button>
    <button class="role-hotspot hotspot-est" type="button" aria-label="Ingresar como estudiante" onclick="mostrarLogin('est')"></button>

    <div class="hero-access-hint" aria-hidden="true">Selecciona tu perfil para ingresar</div>
  </div>
</div>

<!-- ================= LOGIN ================= -->
<div id="login" class="login-uan">
  <div class="login-backdrop"></div>
  <div class="login-box login-box-uan">
    <div class="login-brand-mark">UAN</div>
    <div class="login-kicker">ACCESO INSTITUCIONAL</div>
    <h2>Iniciar sesión</h2>
    <p class="login-subtitle">Universidad Autónoma Nacional · Plataforma Integra</p>
    <input id="user" placeholder="Usuario / Código" autocomplete="username">
    <input id="pass" type="password" placeholder="Contraseña" autocomplete="current-password">
    <div id="loginError" class="login-error" aria-live="polite"></div>
    <button class="login-main-btn" onclick="login()">Entrar al sistema <span>→</span></button>
    <button class="volver login-back-btn" onclick="volverInicio()">← Volver al portal</button>
    <div class="login-status">● SISTEMA ACTIVO · DATOS CIFRADOS</div>
  </div>
</div>

<!-- ================= DASHBOARD ================= -->
<div id="dashboard">
  <div class="topbar">
    <div style="display:flex;align-items:center;gap:12px">
      <span class="topbar-icon" onclick="toggleSidebarMobile()" title="Menú">☰</span>
      <div class="logo-mini">UAN</div>
      <div class="brand">Plataforma Académica Integra UAN</div>
    </div>
    <div style="display:flex;align-items:center;gap:16px">
      <span class="topbar-icon" title="Mensajes">✉️</span>
      <span class="topbar-icon" title="Notificaciones">🔔</span>
      <span id="topbarUsuario" style="font-size:14px">👤</span>
    </div>
  </div>
  <div class="topbar-buscar">🔍 <input placeholder="Buscar en el menú... (próximamente)" disabled></div>

  <div class="sidebar">
    <div class="userbox">
      <img id="fotoPerfil" src="https://via.placeholder.com/90/1e5631/ffffff?text=UAN" alt="foto">
      <div class="rol" id="rolTexto">Rol: —</div>
      <div class="codigo" id="codigoTexto"></div>
      <div class="nombre" id="nombreTexto"></div>
      <button class="cambiar-foto" id="btnCambiarFoto" onclick="cambiarFoto()" style="display:none">Cambiar foto personal</button>
    </div>
    <h3 style="font-size:14px;border-bottom:1px solid #33475a;padding-bottom:6px">Opciones</h3>
    <div id="menuDinamico"></div>
    <button class="logout-btn btn-peligro" onclick="logout()">Salir</button>
  </div>

  <div class="content" id="contenido">
    <h2 class="panel-title">Bienvenido</h2>
  </div>
</div>

<div class="modal-fondo" id="modalFondo" onclick="if(event.target===this) cerrarModal()">
  <div class="modal-caja">
    <button class="modal-cerrar" onclick="cerrarModal()">×</button>
    <div id="modalContenido"></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
<script src="app.js?v=9"></script>
</body>
</html>
